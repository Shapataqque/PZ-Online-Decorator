name: Build v1.1.2

on:
  push:
    branches:
      - release/v1.1.2
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "CHANGELOG.md"
      - "CREDITS.md"
      - "licenses/**"
      - ".github/workflows/build-v1-1-2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.2
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify release markers
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.2'" dist/app.js
          grep -q "PZWorldTopCell" src/pzmap.ts
          grep -q "OnTable" index.html
          grep -q "matchesTile" dist/app.js
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.2"
          git push origin HEAD:release/v1.1.2
