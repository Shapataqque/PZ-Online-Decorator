name: Build v1.1.5

on:
  push:
    branches:
      - release/v1.1.5
    paths:
      - "src/**"
      - "index.html"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-v1-1-5.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.5
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify placement fix
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.5'" dist/app.js
          grep -q "sourceSurfaceOffset" dist/app.js
          grep -q "targetHeight" dist/app.js
          grep -q "target-this.sourceSurfaceOffset" dist/app.js
          grep -q "supportsAt" dist/app.js
          grep -q "1.1.5" index.html
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.5"
          git push origin HEAD:release/v1.1.5
