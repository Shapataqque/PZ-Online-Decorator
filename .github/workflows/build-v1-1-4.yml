name: Build v1.1.4

on:
  push:
    branches:
      - release/v1.1.4
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "README.md"
      - "CHANGELOG.md"
      - "CREDITS.md"
      - "licenses/**"
      - ".github/workflows/build-v1-1-4.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.4
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify release markers
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.4'" dist/app.js
          grep -q "placementModeButtons" index.html
          grep -q "itemHeight(name)" dist/app.js
          grep -q "tableHeight(name)" dist/app.js
          ! grep -q "chooseFromMapBtn" index.html
          ! grep -q "worldMapDialog" index.html
          ! grep -q "openPzmapReference" dist/app.js
          ! grep -q "PZWorldOverview" dist/app.js
          ! grep -q "mode: 'auto'" dist/app.js
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.4"
          git push origin HEAD:release/v1.1.4
