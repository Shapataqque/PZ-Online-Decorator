name: Build v1.1.14

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "CHANGELOG.md"
      - ".github/workflows/build-v1-1-14.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify v1.1.14 changes
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.14'" dist/app.js
          grep -q "pngSkipped" dist/app.js
          grep -q "tilesetCoverage" dist/app.js
          grep -q "fixtures_counters" dist/app.js
          ! grep -q "Catalog-matched sprites are selected as rotatable furniture objects" dist/app.js
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.14"
          git push origin HEAD:main
