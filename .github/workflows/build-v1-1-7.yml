name: Build v1.1.7

on:
  push:
    branches:
      - release/v1.1.7
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-v1-1-7.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.7
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify v1.1.7 changes
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.7'" dist/app.js
          grep -q "placementHeightValues" dist/app.js
          grep -q "placementHeights" dist/app.js
          grep -q "placementHeightControls" index.html
          grep -q "Imported Base is read-only" dist/app.js
          ! grep -q "PlacementMode" dist/app.js
          ! grep -q "placementModeButtons" index.html
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.7"
          git push origin HEAD:release/v1.1.7
