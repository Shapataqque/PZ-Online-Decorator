name: Build v1.1.8

on:
  push:
    branches:
      - release/v1.1.8
    paths:
      - "src/**"
      - "index.html"
      - "styles.css"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/build-v1-1-8.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.8
      - name: Compile TypeScript
        run: npx -y -p typescript@5.8.3 tsc -p tsconfig.json
      - name: Validate JavaScript
        run: node --check dist/app.js
      - name: Verify v1.1.8 changes
        shell: bash
        run: |
          grep -q "APP_VERSION = '1.1.8'" dist/app.js
          grep -q "Imported Base" dist/app.js
          grep -q "Placement height H" dist/app.js
          grep -q "matchesTile(items\[0\].name, false)" dist/app.js
          grep -q "this.selectedFurniture && (this.tool === 'furniture' || this.tool === 'pencil')" dist/app.js
          grep -q "placementHeightControls" index.html
          ! grep -q "read-only Imported Base" README.md
      - name: Commit compiled build
        shell: bash
        run: |
          rm -f .github/workflows/build-v1-1-8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build v1.1.8"
          git push origin HEAD:release/v1.1.8
